name: 小红书视频品牌刮削（定时）

on:
  schedule:
    # UTC 18:30 = 北京时间 02:30，每天一次
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # 允许推送抓取结果回仓库

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
      VISION_MODEL: ${{ secrets.VISION_MODEL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ASR_PROVIDER: ${{ secrets.ASR_PROVIDER }}
      ALIYUN_APP_KEY: ${{ secrets.ALIYUN_APP_KEY }}
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖与 Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 执行无头抓取
        run: python scripts/headless_run.py

      - name: 提交抓取结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: 更新品牌刮削结果 $(date -u +%F)" || echo "无变更"
          git push
